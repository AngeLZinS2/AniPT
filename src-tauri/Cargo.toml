[package]
name = "anipt"
version = "0.3.5"
description = "AniBR desktop backend"
authors = ["AniBR contributors"]
edition = "2021"

[lib]
name = "anipt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "anipt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
urlencoding = "2"
regex = "1"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls", "disable-upload"] }
tokio = { version = "1", features = ["net", "sync", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
